name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # engines: ^22.19 || >=24. This plugin is Windows-only in effect but
        # the no-op path and the injection seams are cross-platform, so every
        # supported OS runs the suite; the lowest supported line runs on Linux.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 22
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Pure ESM with no build step: lib/ is the published source.
      - run: pnpm check:encoding
      - run: pnpm test
      - run: pnpm validate:manifest
      - run: pnpm pack:verify
